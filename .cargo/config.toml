[target.riscv32im-risc0-zkvm-elf]
# Use RISC0's exported getrandom backend. The runtime intentionally refuses
# guest randomness unless its explicit feature is enabled; these programs do
# not generate secrets in the guest. All member secrets originate in wallets.
rustflags = [
  "--cfg", "getrandom_backend=\"custom\"",
  "-C", "passes=lower-atomic",
  "-C", "link-arg=-Ttext=0x00200800",
  "-C", "panic=abort",
]
