[workspace]

[package]
name = "astra-logos-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
astra-logos-testnet-primitives = { path = "../testnet/crates/primitives", features = ["host"] }
astra-logos-testnet-sdk = { path = "../testnet/crates/sdk" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401", features = ["host"] }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "47eba256479f6f785acbd138834340703cd03401", features = ["client"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
borsh = { version = "1.6", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
libc = "0.2"

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.dev]
debug = "line-tables-only"
